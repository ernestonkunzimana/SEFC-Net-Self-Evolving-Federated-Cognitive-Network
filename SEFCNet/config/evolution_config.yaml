name: "SEFCNet"
version: "1.0.0"
log_level: "INFO"

federation:
  num_rounds: 10
  num_clients: 5
  min_fit_clients: 2
  min_evaluate_clients: 2
  min_available_clients: 5
  partition_strategy: "iid"

evolution:
  enable: true
  mutation_rate: 0.1
  population_size: 10
  generations: 50

visualization:
  enable_real_time: true
  update_interval: 5  # seconds
  metrics_history_size: 1000

reinforcement:
  reward_history_size: 100
  update_frequency: 10
  exploration_rate: 0.1

training:
  epochs: 5
  batch_size: 32
  validation_split: 0.2
  
monitoring:
  metrics_interval: 5
  enable_dashboard: true
  port: 8501