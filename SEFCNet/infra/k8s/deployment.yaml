apiVersion: apps/v1
kind: Deployment
metadata:
  name: sefcnet-server
  namespace: sefcnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sefcnet-server
  template:
    metadata:
      labels:
        app: sefcnet-server
    spec:
      containers:
      - name: server
        image: sefcnet-server:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
          name: http
        - containerPort: 8501
          name: dashboard
        - containerPort: 8080
          name: metrics
        env:
        - name: PYTHONPATH
          value: /app
        - name: LOG_LEVEL
          value: INFO
        - name: PORT
          value: "5000"
        - name: DASHBOARD_PORT
          value: "8501"
        - name: PROMETHEUS_PORT
          value: "8080"
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: artifacts
          mountPath: /app/artifacts
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: logs
        persistentVolumeClaim:
          claimName: sefcnet-logs-pvc
      - name: artifacts
        persistentVolumeClaim:
          claimName: sefcnet-artifacts-pvc